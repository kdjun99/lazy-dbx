version: "2"
linters:
  enable:
    - bodyclose
    - depguard
    - errname
    - gocyclo
    - gosec
    - misspell
    - nestif
    - nilerr
    - prealloc
    - revive
    - unconvert
    - whitespace
  disable:
    - funlen
  settings:
    depguard:
      rules:
        app-layer:
          list-mode: strict
          files:
            - '**/internal/app/**'
          allow:
            - $gostd
            - github.com/kdjun99/lazy-dbx/internal/domain
            - github.com/kdjun99/lazy-dbx/internal/app
            - github.com/stretchr/testify
            - github.com/testcontainers/testcontainers-go
            - go.uber.org/mock
        domain-layer:
          list-mode: strict
          files:
            - '**/internal/domain/**'
          allow:
            - $gostd
            - github.com/kdjun99/lazy-dbx/internal/domain
            - github.com/stretchr/testify
            - go.uber.org/mock
        infra-layer:
          list-mode: strict
          files:
            - '**/internal/infra/**'
          allow:
            - $gostd
            - github.com/kdjun99/lazy-dbx/internal/domain
            - github.com/kdjun99/lazy-dbx/internal/infra
            - github.com/pelletier/go-toml/v2
            - github.com/go-sql-driver/mysql
            - github.com/lib/pq
            - golang.org/x/crypto
            - github.com/sahilm/fuzzy
            - github.com/stretchr/testify
            - github.com/testcontainers/testcontainers-go
            - go.uber.org/mock
        tui-layer:
          list-mode: strict
          files:
            - '**/internal/tui/**'
          allow:
            - $gostd
            - github.com/kdjun99/lazy-dbx/internal/tui
            - github.com/kdjun99/lazy-dbx/internal/domain
            - github.com/rivo/tview
            - github.com/gdamore/tcell
            - github.com/stretchr/testify
            - go.uber.org/mock
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: unused-parameter
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        path: cmd/
        text: unused-parameter
      - linters:
          - errcheck
          - gosec
          - revive
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kdjun99/lazy-dbx
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
